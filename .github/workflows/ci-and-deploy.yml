name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# gh-pages is a shared retained-preview branch. Serialize publishers so two
# PRs cannot overwrite each other's branch update at the same time.
concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bunx playwright install chromium
      - run: nix develop --command bun run verify:static
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: verify
    # A fork checkout is safe to verify, but must not receive the repository's
    # write token. Same-repository PRs get retained previews; main gets the
    # production project site.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - name: Determine deployment path
        id: deployment
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=/wfme/pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "destination=pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=/wfme" >> "$GITHUB_OUTPUT"
            echo "destination=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static client
        run: nix develop --command bun run build
        env:
          PUBLIC_BASE_PATH: ${{ steps.deployment.outputs.base }}
          VITE_GIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          destination_dir: ${{ steps.deployment.outputs.destination }}
          keep_files: true
      - name: Link retained pull-request preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: >-
            https://${{ github.repository_owner }}.github.io/wfme/pr${{
            github.event.pull_request.number }}/
        run: >-
          nix develop --command gh pr comment "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --edit-last
          --create-if-none
          --body "Preview: [$PREVIEW_URL]($PREVIEW_URL)"
